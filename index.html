<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>元宝的星星大冒险</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="游戏信息">
        <div>
          <p class="eyebrow">Pixel Adventure</p>
          <h1>元宝的星星大冒险</h1>
        </div>
        <div class="hud" aria-live="polite">
          <div class="score-board">
            <span>游玩次数</span>
            <strong id="playCount">0</strong>
          </div>
          <div class="score-board">
            <span>金币</span>
            <strong id="coins">0</strong>
          </div>
          <div class="score-board">
            <span>生命</span>
            <strong id="hearts">2</strong>
          </div>
          <div class="score-board weapon-board">
            <span>武器</span>
            <strong id="weaponName">小剑</strong>
          </div>
        </div>
      </section>

      <section class="stage-wrap" aria-label="游戏舞台">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="mainMenu" class="main-menu">
          <div class="menu-panel">
            <p id="resultLabel" class="result-label">准备冒险</p>
            <h2>主界面</h2>
            <p id="menuText">打败小怪，打开宝箱，攒金币升级武器。</p>
            <div class="menu-stats" aria-live="polite">
              <div>
                <span>游玩次数</span>
                <strong id="menuPlayCount">0</strong>
              </div>
              <div>
                <span>金币</span>
                <strong id="menuCoins">0</strong>
              </div>
            </div>
          </div>

          <div class="shop-panel">
            <h3>武器商店</h3>
            <div id="shopItems" class="shop-items"></div>
          </div>

          <button id="startButton" class="start-button" type="button">开始游戏</button>
        </div>
      </section>

      <section class="controls" aria-label="操作说明">
        <div class="control-card">
          <span class="key">←</span>
          <span class="key">→</span>
          <p>左右移动</p>
        </div>
        <div class="control-card">
          <span class="key">空格</span>
          <p>跳跃到平台上</p>
        </div>
        <div class="control-card">
          <span class="key">J</span>
          <p>攻击小怪</p>
        </div>
        <div class="control-card">
          <span class="key">Enter</span>
          <p>开始游戏</p>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
