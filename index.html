<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>元宝的星星大冒险</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="游戏信息">
        <div>
          <p class="eyebrow">Pixel Adventure</p>
          <h1>元宝的星星大冒险</h1>
        </div>
        <div class="hud" aria-live="polite">
          <div class="score-board">
            <span>关卡</span>
            <strong id="levelNumber">1</strong>
          </div>
          <div class="score-board">
            <span>游玩次数</span>
            <strong id="playCount">0</strong>
          </div>
          <div class="score-board">
            <span>金币</span>
            <strong id="coins">0</strong>
          </div>
          <div class="score-board">
            <span>等级</span>
            <strong id="heroLevel">1</strong>
          </div>
          <div class="score-board">
            <span>经验</span>
            <strong id="experience">0/10</strong>
          </div>
          <div class="score-board">
            <span>生命</span>
            <strong id="hearts">2</strong>
          </div>
          <div class="score-board">
            <span>剩余怪物</span>
            <strong id="monsterCount">0</strong>
          </div>
          <div class="score-board weapon-board">
            <span>职业</span>
            <strong id="professionName">医生</strong>
          </div>
          <div class="score-board weapon-board">
            <span>武器</span>
            <strong id="weaponName">小剑</strong>
          </div>
        </div>
      </section>

      <section class="stage-wrap" aria-label="游戏舞台">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="mainMenu" class="main-menu">
          <div class="menu-panel">
            <p id="resultLabel" class="result-label">准备冒险</p>
            <h2>主界面</h2>
            <p id="menuText">打败小怪，打开宝箱，攒金币升级武器。</p>
            <div class="profession-panel">
              <h3>选择职业</h3>
              <div id="professionChoices" class="profession-choices"></div>
              <p id="professionHint" class="profession-hint">医生：回复满生命。</p>
            </div>
            <div class="menu-stats" aria-live="polite">
              <div>
                <span>游玩次数</span>
                <strong id="menuPlayCount">0</strong>
              </div>
              <div>
                <span>金币</span>
                <strong id="menuCoins">0</strong>
              </div>
            </div>
          </div>

          <div class="shop-panel">
            <h3>武器商店</h3>
            <div id="shopItems" class="shop-items"></div>
          </div>

          <button id="startButton" class="start-button" type="button">开始游戏</button>
        </div>
        <div class="game-actions">
          <button id="musicButton" type="button">音乐：关</button>
          <button id="healButton" type="button">回复</button>
          <button id="cageButton" type="button">牢笼</button>
          <button id="blackFistButton" type="button">黑拳</button>
          <button id="powerPotionButton" type="button">力量药水</button>
          <button id="medkitButton" type="button">医疗包</button>
        </div>
        <button id="backpackButton" class="backpack-button" type="button">背包</button>
        <div id="backpackPanel" class="backpack-panel is-hidden">
          <div class="backpack-header">
            <h3>背包</h3>
            <button id="closeBackpackButton" type="button">关闭</button>
          </div>
          <div id="inventoryItems" class="inventory-items"></div>
        </div>
      </section>

      <section class="controls" aria-label="操作说明">
        <div class="control-card">
          <span class="key">←</span>
          <span class="key">→</span>
          <p>左右移动</p>
        </div>
        <div class="control-card">
          <span class="key">空格</span>
          <p>跳跃到平台上</p>
        </div>
        <div class="control-card">
          <span class="key">J</span>
          <p>攻击小怪</p>
        </div>
        <div class="control-card">
          <span class="key">K</span>
          <p>扔手榴弹</p>
        </div>
        <div class="control-card">
          <span class="key">Enter</span>
          <p>开始游戏</p>
        </div>
      </section>
    </main>

    <script src="game.js?v=20260806-animals-audio"></script>
  </body>
</html>
